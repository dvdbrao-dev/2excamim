# Regime filter and correlation cap thresholds.
# Pre-committed. Changes require PR with rationale.
schema_version: "v1"

regime:
  enabled: true
  btc_symbol: BTCUSDT
  btc_timeframe: 4h
  ema_period: 200
  adx_threshold: 20
  allowed_regimes_for_long_strategies: ["bull"]

correlation:
  enabled: true
  window_days: 30
  max_correlated_cluster_exposure_pct: 0.30
  correlation_threshold_for_cluster: 0.6
